name: Refresh monitor data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monitor repo
        uses: actions/checkout@v4

      - name: Checkout source lb_eval repo
        uses: actions/checkout@v4
        with:
          repository: WenjiaoYue/lb_eval
          path: source/lb_eval

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate static data artifacts
        run: |
          python3 parser/scan_results.py \
            --source-root ./source/lb_eval/results \
            --output-dir ./static/data \
            --source-repo WenjiaoYue/lb_eval \
            --source-branch main

      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): refresh monitor artifacts'
          file_pattern: static/data/*.json
